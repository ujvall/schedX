[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "schedx"
version = "0.1.0"
description = "Machine-Learning-Assisted Adaptive CPU Scheduling (Phase 1: scheduling core)"
readme = "README.md"
requires-python = ">=3.11"
# The scheduling core (models, scheduler, metrics) uses only the stdlib;
# these are needed by the Phase 2 dataset/ML modules and scripts.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
